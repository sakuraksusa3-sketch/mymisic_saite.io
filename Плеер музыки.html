<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Player</title>
<style>
:root{
  --bg:#07080c;
  --panel:rgba(255,255,255,.035);
  --border:rgba(255,255,255,.08);
  --text:#e9ecf1;
  --muted:#8b93a3;
  --accent:#7c5cff;
  --accent2:#22d3ee;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;
}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0}
body::before{width:560px;height:560px;background:#7c5cff;opacity:.30;top:-180px;left:-160px}
body::after{width:560px;height:560px;background:#22d3ee;opacity:.17;bottom:-220px;right:-180px}

.app{
  position:relative;z-index:1;display:grid;
  grid-template-columns:minmax(320px,400px) minmax(0,1fr);
  gap:22px;max-width:1180px;height:100dvh;margin:0 auto;padding:22px;
}

/* ---------- панели ---------- */
.player,.playlist-panel{
  background:var(--panel);border:1px solid var(--border);border-radius:24px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:22px;display:flex;flex-direction:column;min-height:0;
}
.player{overflow-y:auto;scrollbar-width:none}
.player::-webkit-scrollbar{display:none}
.player-inner{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}

/* ---------- обложка ---------- */
.cover{
  width:100%;max-width:310px;aspect-ratio:1/1;border-radius:20px;
  background:linear-gradient(135deg,#232838,#151a24);
  display:grid;place-items:center;position:relative;overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.06);
  transition:background .45s ease;
}
.cover svg{width:34%;height:34%;opacity:.2;color:#fff;fill:currentColor}

/* ---------- инфо ---------- */
.np-info{text-align:center;width:100%}
.np-info h2{margin:0 0 4px;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-info p{margin:0;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- прогресс ---------- */
.progress-row{display:flex;align-items:center;gap:10px;width:100%;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:99px;position:relative;cursor:pointer;touch-action:none}
.progress::before{content:"";position:absolute;inset:-10px 0}
.progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));position:relative;transition:width .08s linear}
.progress-thumb{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s;box-shadow:0 0 10px rgba(0,0,0,.5)}
.progress:hover .progress-thumb{opacity:1}

/* ---------- кнопки ---------- */
.controls{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.icon-btn{
  position:relative;background:transparent;border:none;color:var(--muted);
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  cursor:pointer;transition:.18s;
}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.icon-btn:hover{color:#fff;background:rgba(255,255,255,.07)}
.icon-btn.active{color:var(--accent2);background:rgba(34,211,238,.1)}
.icon-btn .badge{
  display:none;position:absolute;top:3px;right:3px;font-size:9px;font-weight:700;
  background:var(--accent2);color:#001318;border-radius:99px;width:13px;height:13px;
  line-height:13px;text-align:center;
}
.icon-btn.mode-one .badge{display:block}
.play-btn{
  width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#5b7cff);color:#fff;
  display:grid;place-items:center;box-shadow:0 8px 26px rgba(124,92,255,.45);
  transition:transform .15s,box-shadow .2s;
}
.play-btn:hover{transform:scale(1.06);box-shadow:0 10px 32px rgba(124,92,255,.6)}
.play-btn:active{transform:scale(.96)}
.play-btn svg{width:26px;height:26px;fill:currentColor}

/* ---------- громкость ---------- */
.volume-row{display:flex;align-items:center;gap:8px;width:100%;max-width:250px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;
  background:rgba(255,255,255,.14);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#fff}

/* ---------- плейлист ---------- */
.pl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.pl-title{font-size:16px;font-weight:600;display:flex;align-items:center}
.pl-title span{color:var(--muted);font-weight:500;font-size:12px;background:rgba(255,255,255,.07);padding:2px 9px;border-radius:99px;margin-left:8px}
.pl-actions{display:flex;gap:8px}
.btn{border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.18s;white-space:nowrap}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5b7cff);color:#fff;box-shadow:0 4px 16px rgba(124,92,255,.35)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--muted)}
.btn.ghost:hover{background:rgba(255,255,255,.12);color:#fff}

.search-row{margin-bottom:12px}
#search{
  width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13.5px;
  outline:none;transition:.18s;
}
#search:focus{border-color:rgba(124,92,255,.6);background:rgba(255,255,255,.07)}
#search::placeholder{color:var(--muted)}

.pl-list{flex:1;overflow-y:auto;min-height:0;margin:0 -8px;padding:0 8px;display:flex;flex-direction:column;gap:2px}
.pl-list::-webkit-scrollbar{width:8px}
.pl-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
.pl-list::-webkit-scrollbar-track{background:transparent}

.track{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:12px;cursor:pointer;transition:background .15s}
.track:hover{background:rgba(255,255,255,.05)}
.track.active{background:rgba(124,92,255,.16)}
.t-num{width:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-cover{width:38px;height:38px;border-radius:9px;flex:0 0 38px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.t-info{min-width:0;flex:1}
.t-title{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-artist{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-dur{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.t-del{opacity:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 7px;border-radius:8px;transition:.15s;flex:0 0 auto}
.track:hover .t-del{opacity:1}
.t-del:hover{color:#ff6b81;background:rgba(255,107,129,.12)}
.track.active .t-title{color:#cfc4ff}

.eq{display:flex;align-items:flex-end;gap:2px;height:13px}
.eq i{width:3px;background:var(--accent2);border-radius:1px;transform-origin:bottom;animation:eqb .9s ease-in-out infinite}
.eq i:nth-child(1){height:55%;animation-delay:0s}
.eq i:nth-child(2){height:100%;animation-delay:.25s}
.eq i:nth-child(3){height:70%;animation-delay:.5s}
@keyframes eqb{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
body:not(.is-playing) .eq i{animation-play-state:paused}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;min-height:180px;color:var(--muted);font-size:13.5px;text-align:center;padding:30px 20px;line-height:1.5}
.empty b{color:var(--text);font-weight:600}

/* ---------- drag&drop ---------- */
.drop-overlay{
  position:fixed;inset:0;z-index:50;background:rgba(7,8,12,.82);
  backdrop-filter:blur(6px);display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:opacity .15s;
}
.drop-overlay.show{opacity:1}
.drop-overlay>div{
  border:2px dashed rgba(124,92,255,.7);border-radius:24px;padding:48px 64px;
  font-size:17px;font-weight:600;background:rgba(124,92,255,.08);text-align:center;
}

/* ---------- адаптив ---------- */
@media (max-width:880px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto;min-height:100dvh;padding:14px;gap:14px}
  .playlist-panel{height:62vh}
  .cover{max-width:230px}
  .np-info h2{font-size:17px}
}
</style>
</head>
<body>

<div class="app">
  <!-- ПЛЕЕР -->
  <section class="player">
    <div class="player-inner">
      <div class="cover" id="cover">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>
      </div>

      <div class="np-info">
        <h2 id="np-title">Ничего не играет</h2>
        <p id="np-artist">Загрузи свои треки</p>
      </div>

      <div class="progress-row">
        <span id="time-cur">0:00</span>
        <div class="progress" id="progress">
          <div class="progress-fill" id="progress-fill">
            <div class="progress-thumb"></div>
          </div>
        </div>
        <span id="time-dur">0:00</span>
      </div>

      <div class="controls">
        <button id="btn-shuffle" class="icon-btn" title="Перемешать (S)">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button id="btn-prev" class="icon-btn" title="Предыдущий (P)">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="play-btn" title="Играть / Пауза (Space)">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-next" class="icon-btn" title="Следующий (N)">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="btn-repeat" class="icon-btn" title="Повтор (R)">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <span class="badge">1</span>
        </button>
      </div>

      <div class="volume-row">
        <button id="btn-mute" class="icon-btn" style="width:34px;height:34px" title="Звук (M)">
          <svg viewBox="0 0 24 24" id="vol-icon"><path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
  </section>

  <!-- ПЛЕЙЛИСТ -->
  <section class="playlist-panel">
    <div class="pl-head">
      <div class="pl-title">Плейлист <span id="pl-count">0</span></div>
      <div class="pl-actions">
        <button id="btn-add" class="btn primary">+ Добавить</button>
        <button id="btn-clear" class="btn ghost">Очистить</button>
      </div>
    </div>
    <div class="search-row">
      <input id="search" placeholder="Поиск по трекам..." autocomplete="off">
    </div>
    <div class="pl-list" id="pl-list"></div>
  </section>
</div>

<input type="file" id="file-input" accept="audio/*" multiple hidden>
<div class="drop-overlay" id="drop-overlay"><div>Отпусти файлы, чтобы добавить 🎵</div></div>

<script>
/* ============================================================
   ЭЛЕМЕНТЫ
   ============================================================ */
const audio        = new Audio();
audio.preload      = 'metadata';

const cover        = document.getElementById('cover');
const npTitle      = document.getElementById('np-title');
const npArtist     = document.getElementById('np-artist');
const progressEl   = document.getElementById('progress');
const progressFill = document.getElementById('progress-fill');
const timeCur      = document.getElementById('time-cur');
const timeDur      = document.getElementById('time-dur');
const btnPlay      = document.getElementById('btn-play');
const btnPrev      = document.getElementById('btn-prev');
const btnNext      = document.getElementById('btn-next');
const btnShuffle   = document.getElementById('btn-shuffle');
const btnRepeat    = document.getElementById('btn-repeat');
const btnMute      = document.getElementById('btn-mute');
const volIcon      = document.getElementById('vol-icon');
const volumeEl     = document.getElementById('volume');
const plList       = document.getElementById('pl-list');
const plCount      = document.getElementById('pl-count');
const searchEl     = document.getElementById('search');
const fileInput    = document.getElementById('file-input');
const dropOverlay  = document.getElementById('drop-overlay');

const ICON_PLAY  = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const ICON_VOL   = '<path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>';
const ICON_MUTE  = '<path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>';

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let tracks       = [];
let currentIndex = -1;
let isShuffle    = false;
let repeatMode   = 'off';   // off | all | one
let uid          = 0;
let seeking      = false;
let lastVolume   = 1;

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function fmt(sec){
  if (!isFinite(sec) || sec < 0) return '0:00';
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec % 60;
  return h > 0
    ? h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0')
    : m + ':' + String(s).padStart(2,'0');
}

function coverGradient(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return `linear-gradient(135deg, hsl(${h} 68% 46%), hsl(${(h+70)%360} 72% 30%))`;
}

function parseName(filename){
  const base = filename.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  const parts = base.split(' - ');
  if (parts.length >= 2 && parts[0].trim() && parts.slice(1).join(' - ').trim()) {
    return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
  }
  return { artist: 'Неизвестный исполнитель', title: base || filename };
}

/* ============================================================
   ДОБАВЛЕНИЕ ФАЙЛОВ
   ============================================================ */
const AUDIO_RE = /\.(mp3|wav|ogg|oga|flac|m4a|aac|opus|weba|wma|aiff?|alac)$/i;

function addFiles(fileList){
  const files = Array.from(fileList).filter(f =>
    f.type.startsWith('audio') || AUDIO_RE.test(f.name)
  );
  if (!files.length) return;

  const wasEmpty = tracks.length === 0;

  files.forEach(f => {
    const { title, artist } = parseName(f.name);
    const track = {
      id: ++uid,
      title,
      artist,
      url: URL.createObjectURL(f),
      duration: null,
      el: null
    };
    tracks.push(track);
    queueDuration(track);
  });

  renderPlaylist();

  if (wasEmpty && currentIndex === -1) {
    loadTrack(0, false);
  }
}

/* ---------- фоновое чтение длительности ---------- */
const durLoader = new Audio();
let durQueue = [];
let durBusy  = false;

function queueDuration(track){
  durQueue.push(track);
  if (!durBusy) processDurQueue();
}

function processDurQueue(){
  const track = durQueue.shift();
  if (!track){ durBusy = false; return; }
  durBusy = true;

  const done = () => {
    durLoader.onloadedmetadata = null;
    durLoader.onerror = null;
    processDurQueue();
  };

  durLoader.onloadedmetadata = () => {
    track.duration = durLoader.duration;
    if (track.el){
      const d = track.el.querySelector('.t-dur');
      if (d) d.textContent = fmt(track.duration);
    }
    if (tracks[currentIndex] === track) timeDur.textContent = fmt(track.duration);
    done();
  };
  durLoader.onerror = done;
  durLoader.src = track.url;
}

/* ============================================================
   РЕНДЕР ПЛЕЙЛИСТА
   ============================================================ */
function renderPlaylist(){
  const scrollTop = plList.scrollTop;
  tracks.forEach(t => t.el = null);
  plList.innerHTML = '';

  plCount.textContent = tracks.length;

  if (tracks.length === 0){
    plList.innerHTML =
      '<div class="empty">' +
        '<div style="font-size:34px;opacity:.4">🎧</div>' +
        '<div><b>Плейлист пуст</b><br>Перетащи аудиофайлы сюда<br>или нажми «+ Добавить»</div>' +
      '</div>';
    return;
  }

  const q = searchEl.value.trim().toLowerCase();
  const visible = tracks
    .map((t, i) => ({ t, i }))
    .filter(({ t }) => !q || (t.title + ' ' + t.artist).toLowerCase().includes(q));

  if (visible.length === 0){
    plList.innerHTML = '<div class="empty">Ничего не найдено 🔍</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  visible.forEach(({ t, i }) => {
    const el = document.createElement('div');
    el.className = 'track';
    el.dataset.id = t.id;

    const num = document.createElement('div');
    num.className = 't-num';
    num.textContent = i + 1;

    const cov = document.createElement('div');
    cov.className = 't-cover';
    cov.style.background = coverGradient(t.title + t.artist);

    const info = document.createElement('div');
    info.className = 't-info';
    const ttl = document.createElement('div');
    ttl.className = 't-title';
    ttl.textContent = t.title;
    const art = document.createElement('div');
    art.className = 't-artist';
    art.textContent = t.artist;
    info.append(ttl, art);

    const dur = document.createElement('div');
    dur.className = 't-dur';
    dur.textContent = t.duration != null ? fmt(t.duration) : '--:--';

    const del = document.createElement('button');
    del.className = 't-del';
    del.title = 'Удалить';
    del.textContent = '✕';

    el.append(num, cov, info, dur, del);
    el.addEventListener('click', e => {
      if (e.target === del) return;
      playTrack(i, true);
    });
    del.addEventListener('click', e => {
      e.stopPropagation();
      removeTrack(t.id);
    });

    t.el = el;
    frag.appendChild(el);
  });

  plList.appendChild(frag);
  updateActive();
  plList.scrollTop = scrollTop;
}

/* ============================================================
   ПОДСВЕТКА АКТИВНОГО ТРЕКА
   ============================================================ */
function updateActive(){
  tracks.forEach((t, i) => {
    if (!t.el) return;
    const active = i === currentIndex;
    t.el.classList.toggle('active', active);
    const num = t.el.querySelector('.t-num');
    if (!num) return;
    if (active){
      num.innerHTML = '<div class="eq"><i></i><i></i><i></i></div>';
    } else {
      num.textContent = i + 1;
    }
  });
}

/* ============================================================
   ВОСПРОИЗВЕДЕНИЕ
   ============================================================ */
function loadTrack(index, autoplay){
  if (index < 0 || index >= tracks.length) return;
  currentIndex = index;
  const t = tracks[index];

  audio.src = t.url;

  npTitle.textContent  = t.title;
  npArtist.textContent = t.artist;
  cover.style.background = coverGradient(t.title + t.artist);
  document.title = t.title + ' — ' + t.artist;

  progressFill.style.width = '0%';
  timeCur.textContent = '0:00';
  timeDur.textContent = t.duration != null ? fmt(t.duration) : '0:00';

  updateActive();

  if (autoplay){
    audio.play().catch(() => {});
  }
}

function playTrack(index, autoplay){
  loadTrack(index, autoplay !== false);
}

function togglePlay(){
  if (tracks.length === 0) { fileInput.click(); return; }
  if (currentIndex === -1) { playTrack(0, true); return; }

  if (audio.paused){
    if (!audio.src) playTrack(currentIndex, true);
    else audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

function getNextIndex(dir){
  const n = tracks.length;
  if (n === 0) return -1;

  if (isShuffle && dir > 0){
    if (n === 1) return 0;
    let i;
    do { i = Math.floor(Math.random() * n); } while (i === currentIndex);
    return i;
  }

  let i = currentIndex + dir;
  if (i >= n) i = 0;
  if (i < 0) i = n - 1;
  return i;
}

function nextTrack(){
  const i = getNextIndex(1);
  if (i !== -1) playTrack(i, true);
}

function prevTrack(){
  if (audio.currentTime > 3){
    audio.currentTime = 0;
    return;
  }
  const i = getNextIndex(-1);
  if (i !== -1) playTrack(i, true);
}

function stopPlayback(){
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  currentIndex = -1;
  npTitle.textContent = 'Ничего не играет';
  npArtist.textContent = 'Загрузи свои треки';
  cover.style.background = 'linear-gradient(135deg,#232838,#151a24)';
  progressFill.style.width = '0%';
  timeCur.textContent = '0:00';
  timeDur.textContent = '0:00';
  document.title = 'Music Player';
  updateActive();
}

function removeTrack(id){
  const i = tracks.findIndex(t => t.id === id);
  if (i < 0) return;

  const wasCurrent = i === currentIndex;
  const removed = tracks[i];
  URL.revokeObjectURL(removed.url);
  removed.el = null;
  tracks.splice(i, 1);

  if (i < currentIndex) currentIndex--;

  if (wasCurrent){
    if (tracks.length === 0){
      stopPlayback();
    } else {
      if (currentIndex >= tracks.length) currentIndex = 0;
      playTrack(currentIndex, !audio.paused);
    }
  }

  renderPlaylist();
}

/* ============================================================
   СОБЫТИЯ АУДИО
   ============================================================ */
audio.addEventListener('play', () => {
  btnPlay.innerHTML = ICON_PAUSE;
  document.body.classList.add('is-playing');
});

audio.addEventListener('pause', () => {
  btnPlay.innerHTML = ICON_PLAY;
  document.body.classList.remove('is-playing');
});

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', () => {
  timeDur.textContent = fmt(audio.duration);
  const t = tracks[currentIndex];
  if (t && t.duration == null){
    t.duration = audio.duration;
    if (t.el){
      const d = t.el.querySelector('.t-dur');
      if (d) d.textContent = fmt(t.duration);
    }
  }
});

audio.addEventListener('ended', () => {
  if (repeatMode === 'one'){
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }

  const atEnd = currentIndex === tracks.length - 1;

  if (!isShuffle && repeatMode === 'off' && atEnd){
    audio.currentTime = 0;
    updateProgress();
    return; // остановились в конце
  }

  const i = getNextIndex(1);
  if (i !== -1) playTrack(i, true);
});

audio.addEventListener('error', () => {
  // файл не читается — пробуем следующий
  if (tracks.length > 1) setTimeout(nextTrack, 300);
});

/* ============================================================
   ПРОГРЕСС / ПЕРЕМОТКА
   ============================================================ */
function updateProgress(){
  if (seeking) return;
  const d = audio.duration;
  const c = audio.currentTime || 0;
  const p = (isFinite(d) && d > 0) ? Math.min(1, c / d) : 0;
  progressFill.style.width = (p * 100) + '%';
  timeCur.textContent = fmt(c);
  if (isFinite(d) && d > 0) timeDur.textContent = fmt(d);
}

function seekFromEvent(e){
  const rect = progressEl.getBoundingClientRect();
  let p = (e.clientX - rect.left) / rect.width;
  p = Math.min(1, Math.max(0, p));
  const d = audio.duration;
  if (isFinite(d) && d > 0){
    audio.currentTime = p * d;
    progressFill.style.width = (p * 100) + '%';
    timeCur.textContent = fmt(p * d);
  }
}

progressEl.addEventListener('pointerdown', e => {
  if (!isFinite(audio.duration) || audio.duration <= 0) return;
  seeking = true;
  progressEl.setPointerCapture(e.pointerId);
  seekFromEvent(e);
});
progressEl.addEventListener('pointermove', e => {
  if (seeking) seekFromEvent(e);
});
progressEl.addEventListener('pointerup', e => {
  if (!seeking) return;
  seeking = false;
  try { progressEl.releasePointerCapture(e.pointerId); } catch(_) {}
});
progressEl.addEventListener('pointercancel', () => { seeking = false; });

function seekBy(sec){
  if (!isFinite(audio.duration)) return;
  audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + sec));
  updateProgress();
}

/* ============================================================
   ГРОМКОСТЬ
   ============================================================ */
function updateVolumeIcon(){
  volIcon.innerHTML = (audio.muted || audio.volume === 0) ? ICON_MUTE : ICON_VOL;
}

volumeEl.addEventListener('input', () => {
  audio.volume = parseFloat(volumeEl.value);
  audio.muted = audio.volume === 0;
  if (audio.volume > 0) lastVolume = audio.volume;
  updateVolumeIcon();
});

btnMute.addEventListener('click', () => {
  if (audio.muted || audio.volume === 0){
    audio.muted = false;
    audio.volume = lastVolume || 0.8;
  } else {
    lastVolume = audio.volume;
    audio.muted = true;
  }
  volumeEl.value = audio.muted ? 0 : audio.volume;
  updateVolumeIcon();
});

function changeVolume(delta){
  audio.muted = false;
  audio.volume = Math.min(1, Math.max(0, audio.volume + delta));
  volumeEl.value = audio.volume;
  if (audio.volume > 0) lastVolume = audio.volume;
  updateVolumeIcon();
}

/* ============================================================
   КНОПКИ УПРАВЛЕНИЯ
   ============================================================ */
btnPlay.addEventListener('click', togglePlay);
btnNext.addEventListener('click', nextTrack);
btnPrev.addEventListener('click', prevTrack);

btnShuffle.addEventListener('click', () => {
  isShuffle = !isShuffle;
  btnShuffle.classList.toggle('active', isShuffle);
});

btnRepeat.addEventListener('click', () => {
  repeatMode = repeatMode === 'off' ? 'all' : repeatMode === 'all' ? 'one' : 'off';
  btnRepeat.classList.toggle('active', repeatMode !== 'off');
  btnRepeat.classList.toggle('mode-one', repeatMode === 'one');
  btnRepeat.title = repeatMode === 'off' ? 'Повтор выключен'
                  : repeatMode === 'all' ? 'Повтор всех' : 'Повтор одного';
});

/* ============================================================
   ФАЙЛЫ / DRAG&DROP
   ============================================================ */
document.getElementById('btn-add').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  addFiles(fileInput.files);
  fileInput.value = '';
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (tracks.length === 0) return;
  if (!confirm('Удалить все треки из плейлиста?')) return;
  tracks.forEach(t => URL.revokeObjectURL(t.url));
  tracks = [];
  durQueue = [];
  stopPlayback();
  renderPlaylist();
});

let dragDepth = 0;
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  dropOverlay.classList.add('show');
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth--;
  if (dragDepth <= 0){ dragDepth = 0; dropOverlay.classList.remove('show'); }
});
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  dropOverlay.classList.remove('show');
  if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

/* ============================================================
   ПОИСК
   ============================================================ */
searchEl.addEventListener('input', renderPlaylist);

/* ============================================================
   ГОРЯЧИЕ КЛАВИШИ
   ============================================================ */
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  switch (e.code){
    case 'Space':      e.preventDefault(); togglePlay(); break;
    case 'ArrowRight': e.preventDefault(); seekBy(5); break;
    case 'ArrowLeft':  e.preventDefault(); seekBy(-5); break;
    case 'ArrowUp':    e.preventDefault(); changeVolume(0.05); break;
    case 'ArrowDown':  e.preventDefault(); changeVolume(-0.05); break;
    case 'KeyN':       nextTrack(); break;
    case 'KeyP':       prevTrack(); break;
    case 'KeyM':       btnMute.click(); break;
    case 'KeyS':       btnShuffle.click(); break;
    case 'KeyR':       btnRepeat.click(); break;
  }
});

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
audio.volume = 1;
updateVolumeIcon();
btnPlay.innerHTML = ICON_PLAY;
renderPlaylist();
</script>
</body>
</html>
